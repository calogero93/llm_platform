[project]
name = "doc-extraction"
version = "0.1.0"
description = "Accounting document extraction and reconciliation module"
requires-python = ">=3.12"
dependencies = [
    "llmp",
    "lxml>=6.1.3",
    "numpy>=2.5.3",
    "pillow>=12.3.0",
    "pypdfium2>=5.13.0",
    "reportlab>=5.0.1",
]

[project.entry-points."llmp.modules"]
doc_extraction = "doc_extraction.module:module"

[tool.uv.sources]
llmp = { workspace = true }

[build-system]
requires = ["uv_build>=0.11,<0.13"]
build-backend = "uv_build"
