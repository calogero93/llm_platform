# Candidate B — dense Qwen3-8B, official AWQ W4A16 (see docs/ARCHITECTURE.md §2.2).
model: /models/qwen3-8b-awq
served-model-name: qwen3-8b-awq
max-model-len: 6144
# Under WSL2 only ~6.8 of 7.96 GiB are free at startup (WDDM + CUDA context).
gpu-memory-utilization: 0.85
max-num-seqs: 2
# Smaller prefill chunks lower peak activation memory: the only way to leave room for KV here.
max-num-batched-tokens: 512
kv-cache-dtype: fp8
# Extraction does not benefit from reasoning traces: disable Qwen thinking by default.
default-chat-template-kwargs: '{"enable_thinking": false}'
disable-access-log-for-endpoints: /health,/metrics
# The profiler finds no room for KV at 0.85 utilization under WSL2; a fixed 0.5 GiB (~7.3k fp8
# tokens) fits in practice (verified with a 5.8k-token prompt). See docs/benchmarks/serving.md.
kv-cache-memory: 536870912
